name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@19eac09b398e3d0c747adc7921926a6d802df4da # v0.8.8
        with:
          environments: default
      - name: fypp templates are in sync
        run: |
          pixi run gen
          git diff --exit-code -- src/
      - name: strict f2018 conformance
        run: pixi run -- bash scripts/std-check.sh
      - name: build
        run: pixi run build
      # The wire goldens are only evidence of upstream parity while they are
      # still what the capnp CLI emits; the suite cannot tell them apart from
      # our own earlier output.
      - name: wire goldens still match the capnp CLI
        run: pixi run -- bash scripts/gen-fixtures.sh --check

      - name: level 3 frames still match the capnp CLI
        run: pixi run -- bash scripts/gen-rpc-frames.sh --check
      - name: test
        run: pixi run test
      - name: codegen output matches checked-in modules
        run: |
          BIN=$(find build -name capnpc-fortran -type f | head -1)
          mkdir -p /tmp/gen && cd /tmp/gen
          "$GITHUB_WORKSPACE/$BIN" "$GITHUB_WORKSPACE/test/fixtures/addressbook.cgr.bin"
          "$GITHUB_WORKSPACE/$BIN" "$GITHUB_WORKSPACE/test/fixtures/kitchen.cgr.bin"
          "$GITHUB_WORKSPACE/$BIN" "$GITHUB_WORKSPACE/test/fixtures/rpc.cgr.bin"
          "$GITHUB_WORKSPACE/$BIN" "$GITHUB_WORKSPACE/test/fixtures/rpc-threeparty.cgr.bin"
          "$GITHUB_WORKSPACE/$BIN" "$GITHUB_WORKSPACE/test/fixtures/adder.cgr.bin"
          "$GITHUB_WORKSPACE/$BIN" "$GITHUB_WORKSPACE/test/fixtures/box.cgr.bin"
          "$GITHUB_WORKSPACE/$BIN" "$GITHUB_WORKSPACE/test/fixtures/stream.cgr.bin"
          "$GITHUB_WORKSPACE/$BIN" "$GITHUB_WORKSPACE/test/fixtures/streamer.cgr.bin"
          "$GITHUB_WORKSPACE/$BIN" "$GITHUB_WORKSPACE/test/fixtures/dual.cgr.bin"
          "$GITHUB_WORKSPACE/$BIN" "$GITHUB_WORKSPACE/test/fixtures/holder.cgr.bin"
          diff schema/stream_capnp.f90 "$GITHUB_WORKSPACE/src/stream_capnp.f90"
          diff schema/streamer_capnp.f90 "$GITHUB_WORKSPACE/test/generated/streamer_capnp.f90"
          diff schema/adder_capnp.f90 "$GITHUB_WORKSPACE/test/generated/adder_capnp.f90"
          diff schema/box_capnp.f90 "$GITHUB_WORKSPACE/test/generated/box_capnp.f90"
          diff schema/addressbook_capnp.f90 "$GITHUB_WORKSPACE/test/generated/addressbook_capnp.f90"
          diff schema/kitchen_capnp.f90 "$GITHUB_WORKSPACE/test/generated/kitchen_capnp.f90"
          diff schema/common_capnp.f90 "$GITHUB_WORKSPACE/test/generated/common_capnp.f90"
          diff schema/dual_capnp.f90 "$GITHUB_WORKSPACE/test/generated/dual_capnp.f90"
          diff schema/holder_capnp.f90 "$GITHUB_WORKSPACE/test/generated/holder_capnp.f90"
          diff schema/rpc_capnp.f90 "$GITHUB_WORKSPACE/src/rpc_capnp.f90"
          diff schema/rpc_twoparty_capnp.f90 "$GITHUB_WORKSPACE/src/rpc_twoparty_capnp.f90"
          diff schema/rpc_threeparty_capnp.f90 "$GITHUB_WORKSPACE/src/rpc_threeparty_capnp.f90"
      - name: self-hosting smoke, the plugin digests schema.capnp itself
        run: |
          BIN=$(find build -name capnpc-fortran -type f | head -1)
          MODDIR=$(dirname "$(find build -name capnp.mod | head -1)")
          mkdir -p /tmp/selfhost && cd /tmp/selfhost
          "$GITHUB_WORKSPACE/$BIN" "$GITHUB_WORKSPACE/test/fixtures/schema.cgr.bin"
          test -s schema_capnp.f90
          pixi run --manifest-path "$GITHUB_WORKSPACE/pixi.toml" \
            gfortran -fsyntax-only -I "$GITHUB_WORKSPACE/$MODDIR" schema_capnp.f90

  interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@19eac09b398e3d0c747adc7921926a6d802df4da # v0.8.8
        with:
          environments: interop
      - name: fetch c-capnproto
        run: |
          set -euo pipefail
          rev=$(tr -d '[:space:]' < .github/c-capnproto-rev)
          git init -q third_party/c-capnproto
          git -C third_party/c-capnproto fetch -q --depth 1 https://github.com/HaoZeke/c-capnproto "$rev"
          git -C third_party/c-capnproto checkout -q FETCH_HEAD
      - name: build
        run: |
          pixi run -e interop env \
            CC=x86_64-conda-linux-gnu-gcc \
            CXX=x86_64-conda-linux-gnu-c++ \
            FC=x86_64-conda-linux-gnu-gfortran \
            meson setup build-interop . -Drpc_interop=enabled
          pixi run -e interop meson compile -C build-interop
      - name: golden master vs c-capnproto
        run: |
          pixi run -e interop meson test -C build-interop rpc_interop_cpp -v
          pixi run -e interop meson test -C build-interop golden_master -v

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@19eac09b398e3d0c747adc7921926a6d802df4da # v0.8.8
        with:
          environments: interop
      # Install rules that nothing exercises are how a broken Config.cmake
      # or a stale .pc reaches users. This builds a consumer four ways.
      - name: CMake, find_package, pkg-config and meson subproject
        run: pixi run -e interop bash scripts/packaging-smoke.sh
