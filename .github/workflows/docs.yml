# Build Sphinx docs; lychee on HTML; deploy main to Cloudflare Pages
# (capnp-fortran.rgoswami.me). PR builds upload a documentation artifact
# for HaoZeke/doc-previewer (doc_commenter.yml).
name: Documentation

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - "pixi.toml"
      - "pixi.lock"
      - "lychee.toml"
      - ".github/workflows/docs.yml"
      - ".github/workflows/doc_commenter.yml"
  pull_request:
    paths:
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - "pixi.toml"
      - "lychee.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          environments: docs
          locked: false

      - name: Build documentation site
        run: pixi run -e docs docs

      - name: Install lychee
        uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2
        with:
          tool: lychee@0.24.2

      - name: Link check (lychee on built HTML)
        run: lychee --config lychee.toml --no-progress 'docs/build/**/*.html' README.md

      - name: Upload documentation artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: documentation
          path: docs/build
          retention-days: 14

      - name: Ensure Cloudflare Pages project exists
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@3 pages project create capnp-fortran --production-branch=main || true

      - name: Deploy to Cloudflare Pages
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          github.event_name == 'workflow_dispatch'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs/build --project-name=capnp-fortran --branch=main
